<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>珊瑚缸 KH 紀錄</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- type="module"：讓 app.js 可以用 import 載入其他 JS 檔，而且會等 HTML 解析完才執行 -->
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header>
    <h1>珊瑚缸 KH 紀錄</h1>
    <!-- 狀態訊息：載入中、資料範圍、錯誤訊息，內容由 app.js 填入 -->
    <p id="status" class="status">資料載入中…</p>
  </header>

  <main>
    <!-- 統計卡片，內容由 app.js 產生 -->
    <section id="tiles" class="tiles" aria-label="統計摘要"></section>

    <section class="card">
      <h2>新增紀錄</h2>
      <form id="record-form" class="record-form">
        <label>日期
          <input type="date" name="date" required>
        </label>
        <label>時間（可不填）
          <input type="time" name="time">
        </label>
        <label>KH (dKH)
          <input type="number" name="kh" step="0.1" min="0.1" max="20" inputmode="decimal" required>
        </label>
        <label>添加量 (mL／天，可不填)
          <input type="number" name="dose_ml" step="0.1" min="0" inputmode="decimal">
        </label>
        <label>水樣
          <select name="type">
            <option value="tank">魚缸水（一般測量）</option>
            <option value="standard">標準液（儀器驗證）</option>
          </select>
        </label>
        <label class="wide">備註
          <input type="text" name="note" maxlength="100" placeholder="例如：換水 10 L 後、Hanna 重測">
        </label>
        <label class="check wide">
          <input type="checkbox" name="exclude">
          異常或可疑讀值，不納入統計
        </label>
        <div class="form-actions wide">
          <button type="submit" class="primary">新增</button>
          <!-- role="status"：內容更新時，螢幕閱讀器會唸出來 -->
          <span id="form-message" class="form-message" role="status"></span>
        </div>
      </form>

      <div class="export">
        <p id="export-info"></p>
        <button id="export-button" type="button">匯出 JSON</button>
        <details>
          <summary>如何把新紀錄寫回專案</summary>
          <ol>
            <li>按「匯出 JSON」，下載 <code>kh-records.json</code>。</li>
            <li>用下載的檔案取代專案裡的 <code>data/kh-records.json</code>。</li>
            <li>在 VS Code 的「原始檔控制」提交並同步。</li>
            <li>重新整理這個頁面，已寫入檔案的紀錄會自動從瀏覽器暫存中移除。</li>
          </ol>
        </details>
      </div>
    </section>

    <section class="card">
      <h2>KH 趨勢 (dKH)</h2>
      <ul class="legend">
        <li><span class="key key-line"></span>每日 KH（有效讀值平均）</li>
        <li><span class="key key-cross">×</span>已排除讀值</li>
      </ul>

      <!-- 兩張圖共用同一個時間軸與提示框 -->
      <div id="chart-area" class="chart-area">
        <div id="kh-chart" class="chart" tabindex="0" role="img"
             aria-label="每日 KH 折線圖，可用左右方向鍵逐日查看，完整數值請見下方表格"></div>
        <h3>每日添加量 (mL)</h3>
        <div id="dose-chart" class="chart" role="img"
             aria-label="每日添加量階梯圖，完整數值請見下方表格"></div>
        <div id="tooltip" class="tooltip" hidden></div>
      </div>
    </section>

    <section class="card">
      <h2>所有讀值</h2>
      <!-- 外層包一個 div，手機螢幕太窄時表格可以左右捲動 -->
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col">日期</th>
              <th scope="col">時間</th>
              <th scope="col" class="num">KH (dKH)</th>
              <th scope="col" class="num">添加量 (mL)</th>
              <th scope="col">狀態</th>
              <th scope="col">備註</th>
            </tr>
          </thead>
          <!-- tbody 故意留空，資料列由 app.js 產生 -->
          <tbody id="kh-body"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
